name: MercatoPULSE — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: mercatopulse-api
  REGISTRY: ghcr.io/${{ github.repository_owner }}

# ══════════════════════════════════════════════════════════════════════
# JOB 1 — Security Scanning (DevSecOps)
# ══════════════════════════════════════════════════════════════════════
jobs:
  security-scan:
    name: 🔐 Security SAST & Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install bandit safety

      - name: Bandit — Python SAST Vulnerability Scan
        run: bandit -r backend/ src/ -f json -o bandit-report.json --severity-level medium || true

      - name: Safety — CVE Dependency Check
        run: safety check -r requirements.txt --json --output safety-report.json || true

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

# ══════════════════════════════════════════════════════════════════════
# JOB 2 — Code Quality Gate (SonarQube)
# ══════════════════════════════════════════════════════════════════════
  sonarqube:
    name: 📊 SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=mercatopulse
            -Dsonar.projectName=MercatoPULSE
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=backend,src
            -Dsonar.tests=tests
            -Dsonar.python.version=3.11

# ══════════════════════════════════════════════════════════════════════
# JOB 3 — Tests (pytest + Coverage)
# ══════════════════════════════════════════════════════════════════════
  tests:
    name: 🧪 pytest Suite & Coverage
    runs-on: ubuntu-latest
    needs: security-scan

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov pytest-asyncio

      - name: Run pytest with coverage
        run: pytest tests/ -v --cov=backend --cov=src --cov-report=xml --cov-report=term-missing
        env:
          DATABASE_URL: sqlite:///./test.db

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

# ══════════════════════════════════════════════════════════════════════
# JOB 4 — Docker Build & Push to GHCR
# ══════════════════════════════════════════════════════════════════════
  docker-build:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [tests, sonarqube]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ══════════════════════════════════════════════════════════════════════
# JOB 5 — Deploy to Render (Production)
# ══════════════════════════════════════════════════════════════════════
  deploy-production:
    name: 🚀 Deploy to Render Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://mercatopulse-api.onrender.com

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -s --fail -X POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -d '' \
            | jq .

      - name: Wait for Deployment
        run: sleep 30

      - name: Smoke Test — Health Check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://mercatopulse-api.onrender.com/api/v1/health")
          if [ "$response" != "200" ]; then
            echo "Health check failed! HTTP status: $response"
            exit 1
          fi
          echo "✅ Production health check passed (HTTP $response)"

      - name: Notify Deployment Success
        if: success()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            -d '{"text": "✅ MercatoPULSE deployed successfully to production! Commit: ${{ github.sha }}"}'
