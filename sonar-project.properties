# SonarQube Project Configuration
# https://docs.sonarqube.org/latest/project-administration/project-settings/

sonar.projectKey=mercatopulse
sonar.projectName=MercatoPULSE
sonar.projectVersion=3.1.0
sonar.organization=aymantn1

# Sources à analyser
sonar.sources=backend,src
sonar.tests=tests
sonar.python.version=3.11

# Exclusions
sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  **/migrations/**,\
  **/data/**,\
  **/docs/**,\
  **/temp/**,\
  web/**

sonar.test.exclusions=**/data/**

# Coverage
sonar.python.coverage.reportPaths=coverage.xml

# Encodage
sonar.sourceEncoding=UTF-8

# Quality Gate (fail si coverage < 60%)
sonar.qualitygate.wait=true
