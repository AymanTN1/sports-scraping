<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Filtres de lueur Néon -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00F0FF" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00F0FF" flood-opacity="0.5" />
    </filter>

    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00FF66" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00FF66" flood-opacity="0.6" />
    </filter>

    <filter id="glow-violet" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#B026FF" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#B026FF" flood-opacity="0.45" />
    </filter>

    <!-- Dégradé pour le faisceau radar (Scanner Sweep) -->
    <linearGradient id="radar-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#00FF66" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="violet-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B026FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#B026FF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Styles d'animation intégrés pour rotation HUD -->
    <style>
      .spin-clockwise {
        transform-origin: 400px 400px;
        animation: spin 8s linear infinite;
      }
      .spin-counter {
        transform-origin: 400px 400px;
        animation: spin-reverse 15s linear infinite;
      }
      .radar-beam {
        transform-origin: 400px 400px;
        animation: spin 3s linear infinite;
      }
      .pulse-node {
        animation: pulse 2s ease-in-out infinite alternate;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spin-reverse {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0% { opacity: 0.4; }
        100% { opacity: 1; }
      }
      .hud-text {
        font-family: 'Courier New', Courier, monospace, sans-serif;
        font-size: 16px;
        font-weight: bold;
        fill: #00F0FF;
        letter-spacing: 2px;
      }
    </style>
  </defs>

  <!-- Fond Noir Profond Cyberpunk -->
  <rect width="800" height="800" fill="#030508" />

  <!-- ================= COUCHE 1 : GRILLES & GRADUATIONS FIXES ================= -->
  <g filter="url(#glow-cyan)">
    <!-- Anneau extérieur principal -->
    <circle cx="400" cy="400" r="350" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.4" fill="none" />
    <circle cx="400" cy="400" r="335" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.3" fill="none" />

    <!-- Lignes de visée cardinales -->
    <line x1="400" y1="40" x2="400" y2="120" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.7" />
    <line x1="400" y1="680" x2="400" y2="760" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.7" />
    <line x1="40" y1="400" x2="120" y2="400" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.7" />
    <line x1="680" y1="400" x2="760" y2="400" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.7" />

    <!-- Graduations fines (Ticks) sur l'anneau 335 -->
    <g stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6">
      <line x1="400" y1="65" x2="400" y2="75" transform="rotate(15 400 400)" />
      <line x1="400" y1="65" x2="400" y2="75" transform="rotate(30 400 400)" />
      <line x1="400" y1="60" x2="400" y2="75" transform="rotate(45 400 400)" stroke-width="2" />
      <line x1="400" y1="65" x2="400" y2="75" transform="rotate(60 400 400)" />
      <line x1="400" y1="65" x2="400" y2="75" transform="rotate(75 400 400)" />
      
      <line x1="400" y1="65" x2="400" y2="75" transform="rotate(105 400 400)" />
      <line x1="400" y1="65" x2="400" y2="75" transform="rotate(120 400 400)" />
      <line x1="400" y1="60" x2="400" y2="75" transform="rotate(135 400 400)" stroke-width="2" />
      <line x1="400" y1="65" x2="400" y2="75" transform="rotate(150 400 400)" />
      <line x1="400" y1="65" x2="400" y2="75" transform="rotate(165 400 400)" />

      <line x1="400" y1="65" x2="400" y2="75" transform="rotate(195 400 400)" />
      <line x1="400" y1="65" x2="400" y2="75" transform="rotate(210 400 400)" />
      <line x1="400" y1="60" x2="400" y2="75" transform="rotate(225 400 400)" stroke-width="2" />
      <line x1="400" y1="65" x2="400" y2="75" transform="rotate(240 400 400)" />
      <line x1="400" y1="65" x2="400" y2="75" transform="rotate(255 400 400)" />

      <line x1="400" y1="65" x2="400" y2="75" transform="rotate(285 400 400)" />
      <line x1="400" y1="65" x2="400" y2="75" transform="rotate(300 400 400)" />
      <line x1="400" y1="60" x2="400" y2="75" transform="rotate(315 400 400)" stroke-width="2" />
      <line x1="400" y1="65" x2="400" y2="75" transform="rotate(330 400 400)" />
      <line x1="400" y1="65" x2="400" y2="75" transform="rotate(345 400 400)" />
    </g>
  </g>

  <!-- ================= COUCHE 2 : TYPOGRAPHIE HUD & POURCENTAGES CORRECTS ================= -->
  <g class="hud-text" filter="url(#glow-cyan)">
    <!-- 0% en haut (12h) -->
    <text x="400" y="28" text-anchor="middle">0%</text>
    <!-- 25% à droite (3h) -->
    <text x="775" y="405" text-anchor="middle">25%</text>
    <!-- 50% en bas (6h) - CORRIGÉ -->
    <text x="400" y="785" text-anchor="middle">50%</text>
    <!-- 75% à gauche (9h) -->
    <text x="25" y="405" text-anchor="middle">75%</text>

    <!-- Libellés techniques HUD -->
    <text x="400" y="145" text-anchor="middle" font-size="10px" opacity="0.7">SCOUT RADAR // SCANNING DATA</text>
    <text x="400" y="665" text-anchor="middle" font-size="10px" opacity="0.7">PERFORMANCE MATRIX // PLAYER METRICS</text>
  </g>

  <!-- ================= COUCHE 3 : ARCS DE SCANNER VERT FLUO ================= -->
  <g filter="url(#glow-green)">
    <path d="M 440 52 A 348 348 0 0 1 540 80" stroke="#00FF66" stroke-width="6" stroke-linecap="round" fill="none" stroke-dasharray="12 8" />
    <path d="M 620 180 A 348 348 0 0 1 680 260" stroke="#00FF66" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 520 720 A 348 348 0 0 1 430 747" stroke="#00FF66" stroke-width="5" stroke-linecap="round" fill="none" stroke-dasharray="6 6" />
    <path d="M 140 600 A 348 348 0 0 1 80 500" stroke="#00FF66" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- ================= COUCHE 4 : ANNEAUX TOURNANTS & VIOLET ÉLECTRIQUE ================= -->
  <!-- Anneau intermédiaire violet (rotation lente anti-horaire) -->
  <g class="spin-counter" filter="url(#glow-violet)">
    <circle cx="400" cy="400" r="250" stroke="url(#violet-fade)" stroke-width="2.5" stroke-dasharray="80 30 20 30 40 40" fill="none" />
    <circle cx="400" cy="150" r="5" fill="#B026FF" />
    <circle cx="650" cy="400" r="5" fill="#B026FF" />
    <circle cx="400" cy="650" r="5" fill="#B026FF" />
    <circle cx="150" cy="400" r="5" fill="#B026FF" />
  </g>

  <!-- Anneau de ciblage cyan (rotation horaire) -->
  <g class="spin-clockwise" filter="url(#glow-cyan)">
    <circle cx="400" cy="400" r="290" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="15 10 5 10" fill="none" opacity="0.6" />
    <circle cx="400" cy="400" r="190" stroke="#00F0FF" stroke-width="2" stroke-dasharray="140 20 60 20" fill="none" />
    
    <!-- Repères hexagones et cibles flottantes -->
    <polygon points="400,102 408,110 400,118 392,110" fill="none" stroke="#00FF66" stroke-width="2" />
    <polygon points="400,682 408,690 400,698 392,690" fill="none" stroke="#00FF66" stroke-width="2" />
    <polygon points="110,400 118,408 110,416 102,408" fill="none" stroke="#00F0FF" stroke-width="2" />
    <polygon points="690,400 698,408 690,416 682,408" fill="none" stroke="#00F0FF" stroke-width="2" />
  </g>

  <!-- ================= COUCHE 5 : FAISCEAU RADAR (ANIMÉ) ================= -->
  <g class="radar-beam">
    <!-- Secteur de balayage translucide -->
    <path d="M 400 400 L 690 290 A 310 310 0 0 1 710 400 Z" fill="url(#radar-sweep)" />
    <!-- Ligne de front de scan verte -->
    <line x1="400" y1="400" x2="710" y2="400" stroke="#00FF66" stroke-width="2.5" filter="url(#glow-green)" />
    <!-- Points de données détectés sous le radar -->
    <circle cx="580" cy="370" r="3.5" fill="#00FF66" filter="url(#glow-green)" class="pulse-node" />
    <circle cx="510" cy="330" r="2.5" fill="#00F0FF" filter="url(#glow-cyan)" />
    <circle cx="640" cy="385" r="4" fill="#00FF66" filter="url(#glow-green)" />
    <circle cx="470" cy="360" r="3" fill="#B026FF" filter="url(#glow-violet)" />
  </g>

  <!-- ================= COUCHE 6 : NAYAU DE DONNÉES & BALLON CYBERPUNK ================= -->
  <!-- Anneau de protection central -->
  <g filter="url(#glow-cyan)">
    <circle cx="400" cy="400" r="115" stroke="#00F0FF" stroke-width="3" fill="#040810" fill-opacity="0.8" />
    <circle cx="400" cy="400" r="105" stroke="#00F0FF" stroke-width="1" stroke-dasharray="6 4" fill="none" opacity="0.5" />
    
    <!-- Pistes de circuits imprimés (PCB Traces) sortant du centre -->
    <path d="M 330 350 L 300 350 L 280 330" stroke="#00F0FF" stroke-width="2" fill="none" />
    <circle cx="280" cy="330" r="3" fill="#00F0FF" />
    
    <path d="M 470 350 L 500 350 L 520 330" stroke="#00F0FF" stroke-width="2" fill="none" />
    <circle cx="520" cy="330" r="3" fill="#00FF66" filter="url(#glow-green)" />
    
    <path d="M 330 450 L 300 450 L 280 470" stroke="#00F0FF" stroke-width="2" fill="none" />
    <circle cx="280" cy="470" r="3" fill="#B026FF" filter="url(#glow-violet)" />
    
    <path d="M 470 450 L 500 450 L 520 470" stroke="#00F0FF" stroke-width="2" fill="none" />
    <circle cx="520" cy="470" r="3" fill="#00F0FF" />
  </g>

  <!-- BALLON DE FOOTBALL HIGH-TECH AU CENTRE -->
  <g filter="url(#glow-cyan)">
    <!-- Contour extérieur du ballon -->
    <circle cx="400" cy="400" r="75" stroke="#00F0FF" stroke-width="3" fill="#03060C" />
    <circle cx="400" cy="400" r="70" stroke="#00FF66" stroke-width="1" stroke-opacity="0.4" fill="none" />

    <!-- Pentagone central (cœur du ballon) -->
    <polygon points="400,365 433,389 420,428 380,428 367,389" stroke="#00F0FF" stroke-width="2.5" fill="none" stroke-linejoin="round" />
    <!-- Lignes de tension vers les sommets externes -->
    <line x1="400" y1="365" x2="400" y2="325" stroke="#00F0FF" stroke-width="2" />
    <line x1="433" y1="389" x2="471" y2="377" stroke="#00F0FF" stroke-width="2" />
    <line x1="420" y1="428" x2="444" y2="461" stroke="#00F0FF" stroke-width="2" />
    <line x1="380" y1="428" x2="356" y2="461" stroke="#00F0FF" stroke-width="2" />
    <line x1="367" y1="389" x2="329" y2="377" stroke="#00F0FF" stroke-width="2" />

    <!-- Hexagones périphériques (Maillage géométrique) -->
    <path d="M 400 325 L 438 337 L 471 377" stroke="#00F0FF" stroke-width="1.8" fill="none" opacity="0.8" />
    <path d="M 471 377 L 465 420 L 444 461" stroke="#00F0FF" stroke-width="1.8" fill="none" opacity="0.8" />
    <path d="M 444 461 L 400 475 L 356 461" stroke="#00F0FF" stroke-width="1.8" fill="none" opacity="0.8" />
    <path d="M 356 461 L 335 420 L 329 377" stroke="#00F0FF" stroke-width="1.8" fill="none" opacity="0.8" />
    <path d="M 329 377 L 362 337 L 400 325" stroke="#00F0FF" stroke-width="1.8" fill="none" opacity="0.8" />

    <!-- Nœuds tactiques lumineux sur le ballon -->
    <circle cx="400" cy="365" r="4" fill="#00FF66" filter="url(#glow-green)" />
    <circle cx="433" cy="389" r="4" fill="#00F0FF" />
    <circle cx="420" cy="428" r="4" fill="#B026FF" filter="url(#glow-violet)" />
    <circle cx="380" cy="428" r="4" fill="#00F0FF" />
    <circle cx="367" cy="389" r="4" fill="#00FF66" filter="url(#glow-green)" />
    <circle cx="400" cy="400" r="3" fill="#00F0FF" />
  </g>
</svg>
