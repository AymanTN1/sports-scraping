worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ──────────────────────────────────────────────────────────────
    # Logging
    # ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ──────────────────────────────────────────────────────────────
    # Performance
    # ──────────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    gzip                on;
    gzip_vary           on;
    gzip_min_length     1024;
    gzip_types          text/plain text/css application/json application/javascript
                        text/xml application/xml image/svg+xml;

    # ──────────────────────────────────────────────────────────────
    # Security Headers
    # ──────────────────────────────────────────────────────────────
    server_tokens       off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;" always;

    # ──────────────────────────────────────────────────────────────
    # Rate Limiting (Anti-DDoS / Bot Protection)
    # ──────────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/m;

    # ──────────────────────────────────────────────────────────────
    # Upstream API
    # ──────────────────────────────────────────────────────────────
    upstream mercatopulse_api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ── Frontend (Fichiers Statiques Web) ──
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ── API REST (Proxy vers FastAPI) ──
        location /api/ {
            limit_req zone=api_limit burst=15 nodelay;

            proxy_pass         http://mercatopulse_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── Server-Sent Events (SSE) — Désactiver le buffering ──
        location /api/v1/pipeline/stream {
            proxy_pass         http://mercatopulse_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
        }
    }
}
